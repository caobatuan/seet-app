services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: seating-app-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: seating-app-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
